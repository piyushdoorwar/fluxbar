name: Package extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Tag must be v<integer> (e.g. v2); EGO requires an integer version.
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+$'; then
            echo "::error::Tag must be v<integer> (e.g. v2); got '$GITHUB_REF_NAME'"
            exit 1
          fi
          jq --argjson v "$VERSION" '.version = $v' metadata.json > metadata.tmp
          mv metadata.tmp metadata.json
          echo "metadata.json version set to $VERSION"
          cat metadata.json

      - name: Build zip
        run: make pack

      - name: Verify package
        run: |
          ZIP=fluxbar@piyushdoorwar.github.io.zip
          # GNOME Shell 45+ compiles the schema at install time, so the
          # precompiled binary must never be shipped (it gets the upload rejected).
          if unzip -l "$ZIP" | grep -q gschemas.compiled; then
            echo "::error::gschemas.compiled must not be packaged"
            exit 1
          fi
          unzip -l "$ZIP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxbar-extension
          path: fluxbar@piyushdoorwar.github.io.zip
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "fluxbar@piyushdoorwar.github.io.zip" --generate-notes
