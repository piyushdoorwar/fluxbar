name: Package extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version name from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # extensions.gnome.org assigns the numeric version itself; the tag only sets
          # the human-readable version-name (letters, digits, spaces and dots, max 16).
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION_NAME" | grep -qE '^[A-Za-z0-9. ]{1,16}$'; then
            echo "::error::Tag must be v<version>, e.g. v3 or v3.1; got '$GITHUB_REF_NAME'"
            exit 1
          fi
          jq --arg v "$VERSION_NAME" '."version-name" = $v | del(.version)' metadata.json > metadata.tmp
          mv metadata.tmp metadata.json
          cat metadata.json

      - name: Build zip
        run: make pack

      - name: Verify package
        run: |
          ZIP=fluxbar@piyushdoorwar.github.io.zip
          unzip -l "$ZIP"
          # Files extensions.gnome.org's automated review flags. GNOME Shell 45+
          # compiles the schema itself, so gschemas.compiled must never be shipped.
          if unzip -Z1 "$ZIP" | grep -E 'gschemas\.compiled|(^|/)\.git|\.po$|\.pot$|^screenshots/|Makefile|package(-lock)?\.json|\.editorconfig|\.eslintrc'; then
            echo "::error::The package contains files extensions.gnome.org rejects (listed above)"
            exit 1
          fi
          SIZE=$(stat -c %s "$ZIP")
          if [ "$SIZE" -gt 5000000 ]; then
            echo "::error::Package is $SIZE bytes; extensions.gnome.org accepts at most 5 MB"
            exit 1
          fi
          for f in metadata.json extension.js prefs.js utils.js schemas/org.gnome.shell.extensions.fluxbar.gschema.xml; do
            unzip -Z1 "$ZIP" | grep -qx "$f" || { echo "::error::$f is missing from the package"; exit 1; }
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxbar-extension
          path: fluxbar@piyushdoorwar.github.io.zip
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=fluxbar@piyushdoorwar.github.io.zip
          # Idempotent: update the asset if the release already exists (re-runs, retags).
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --generate-notes
          fi

  # Optional: submits the zip to extensions.gnome.org for review. Runs only when the
  # EGO_USERNAME and EGO_PASSWORD repository secrets exist; without them the release
  # is created as usual and you upload the zip by hand at extensions.gnome.org/upload.
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # `gnome-extensions upload` arrived in GNOME Shell 49; Fedora 43 ships it.
    container: fedora:43
    steps:
      - name: Check for credentials
        id: creds
        env:
          EGO_USERNAME: ${{ secrets.EGO_USERNAME }}
          EGO_PASSWORD: ${{ secrets.EGO_PASSWORD }}
        run: |
          if [ -n "$EGO_USERNAME" ] && [ -n "$EGO_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::EGO_USERNAME/EGO_PASSWORD secrets not set; skipping upload to extensions.gnome.org."
          fi

      - name: Download package
        if: steps.creds.outputs.present == 'true'
        uses: actions/download-artifact@v4
        with:
          name: fluxbar-extension

      - name: Upload to extensions.gnome.org
        if: steps.creds.outputs.present == 'true'
        env:
          EGO_USERNAME: ${{ secrets.EGO_USERNAME }}
          EGO_PASSWORD: ${{ secrets.EGO_PASSWORD }}
        run: |
          dnf install -y -q gnome-shell > /dev/null
          # Pass the password through a file, never on the command line or in logs.
          PASSWORD_FILE="$(mktemp)"
          trap 'rm -f "$PASSWORD_FILE"' EXIT
          printf '%s' "$EGO_PASSWORD" > "$PASSWORD_FILE"
          gnome-extensions upload --accept-tos \
            --user "$EGO_USERNAME" \
            --password-file "$PASSWORD_FILE" \
            fluxbar@piyushdoorwar.github.io.zip
